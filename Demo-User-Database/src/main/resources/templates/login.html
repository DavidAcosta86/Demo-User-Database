<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-green-50 min-h-screen flex items-center justify-center text-gray-800"
  >
    <div
      class="bg-white p-10 rounded-2xl shadow-lg text-center w-full max-w-md"
    >
      <h2 class="text-2xl font-bold mb-6">Log in</h2>
      <a
        th:href="@{/oauth2/authorization/google}"
        class="inline-block bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-xl transition-all duration-300"
      >
        Login with Google
      </a>
    </div>
  </body>
</html>
