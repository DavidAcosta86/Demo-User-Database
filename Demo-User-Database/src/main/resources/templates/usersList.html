<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registered Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-green-50 text-green-900 font-sans min-h-screen">
    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <!-- MAIN CONTENT -->
    <div class="flex items-center justify-center p-4">
      <div class="w-full max-w-3xl bg-white rounded-2xl shadow-lg p-6 mt-10">
        <h1 class="text-3xl font-bold text-center text-green-700 mb-6">
          Registered Users
        </h1>

        <div class="space-y-4">
          <table
            class="w-full text-left border border-green-100 rounded-lg overflow-hidden"
          >
            <thead class="bg-green-100 text-green-800">
              <tr>
                <th class="p-3 font-semibold">User</th>
                <th class="p-3 font-semibold">Email</th>
              </tr>
            </thead>
            <tbody>
              <tr
                th:each="user : ${users}"
                class="hover:bg-green-50 transition"
              >
                <td class="p-3 flex items-center gap-3">
                  <img
                    th:src="${user.profilePicUrl}"
                    alt="Profile"
                    class="w-10 h-10 rounded-full border border-green-200 shadow-sm"
                  />
                  <span th:text="${user.userName}"></span>
                </td>
                <td class="p-3" th:text="${user.email}"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
