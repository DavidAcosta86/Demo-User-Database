<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-green-50 text-green-900 font-sans min-h-screen p-4">
    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <!-- MAIN CONTENT -->
    <div class="flex flex-col items-center justify-center mt-10 space-y-4">
      <h1 class="text-4xl font-bold text-green-800">
        Welcome, <span th:text="${name}">User</span>!
      </h1>
      <p class="text-lg">Email: <span th:text="${email}"></span></p>
      <img th:src="${picture}" alt="Foto de perfil" width="100" />
    </div>
  </body>
</html>
